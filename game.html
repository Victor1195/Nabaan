<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match - nabaan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }

    body {
      background-color: #f4f5f7;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    .navbar {
      background-color: #0d0d0d;
      color: #ffffff;
      padding: 0.75rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 2.5rem;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-link {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      opacity: 0.9;
    }

    .nav-link:hover, .nav-link.active {
      opacity: 1;
    }

    .logout-btn {
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Main Container */
    .container {
      max-width: 1100px;
      width: 100%;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      flex: 1;
    }

    .page-title {
      font-size: 2.25rem;
      font-weight: 800;
      margin-bottom: 2rem;
      color: #0f172a;
    }

    /* Card Content */
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
      margin-bottom: 2rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin: 1.5rem 0;
    }

    /* Action Buttons */
    .btn {
      width: 100%;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .btn-dark {
      background-color: #23272e;
      color: #ffffff;
    }

    .btn-dark:hover {
      background-color: #1a1d23;
    }

    .btn-navy {
      background-color: #111625;
      color: #ffffff;
    }

    .btn-navy:hover {
      background-color: #0a0d17;
    }

    .btn-active-lock {
      background-color: #d97706 !important;
      color: #fff;
    }

    .btn-sm {
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    .btn-danger {
      background-color: #ef4444;
      color: white;
    }
    
    .btn-success {
      background-color: #10b981;
      color: white;
    }

    /* Form Controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1a1a1a;
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      color: #334155;
      background-color: #ffffff;
    }

    .form-control::placeholder {
      color: #94a3b8;
    }

    .form-control:focus {
      border-color: #94a3b8;
    }

    .form-control:disabled {
      background-color: #f1f5f9;
      cursor: not-allowed;
    }

    /* Queue & Pool Section */
    .section-header {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .queue-item {
      background: #ffffff;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border-left: 5px solid #0284c7;
    }

    .match-teams {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-weight: 600;
    }

    .vs-badge {
      background: #e2e8f0;
      color: #475569;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-size: 0.75rem;
    }

    /* Modal / Drawer */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1rem 0;
      max-height: 200px;
      overflow-y: auto;
    }

    .tag {
      background: #e0f2fe;
      color: #0369a1;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tag .close {
      cursor: pointer;
      color: #0284c7;
      font-weight: bold;
    }

    .divider {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 2rem 0;
    }

    /* Footer */
    .footer {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      color: #475569;
      font-size: 0.85rem;
    }

    .footer-left p { margin-bottom: 0.25rem; }
    .footer-left strong { color: #0284c7; }
    .footer-right { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; color: #334155; }
    .ig-icon {
      width: 24px; height: 24px;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      color: white; font-size: 14px;
    }

    @media (max-width: 900px) { .grid-4 { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 600px) {
      .grid-2, .grid-4 { grid-template-columns: 1fr; }
      .navbar { flex-direction: column; gap: 1rem; }
      .queue-item { flex-direction: column; gap: 1rem; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- Header / Nav -->
  <nav class="navbar">
    <div class="nav-left">
      <div class="brand"><span>🏸</span> Ngueak San</div>
      <div class="nav-links">
        <a href="#" class="nav-link">🏠 Home</a>
        <a href="#" class="nav-link active">⚔️ Match</a>
        <a href="#" class="nav-link">👤 Member</a>
        <a href="#" class="nav-link">💰 Payment</a>
      </div>
    </div>
    <div class="nav-right">
      <a href="#" class="logout-btn"><span style="color:#d97706;">❚</span> Logout</a>
    </div>
  </nav>

  <!-- Content -->
  <main class="container">
    <h1 class="page-title">MATCH : ตารางแข่งขัน</h1>

    <div class="card">
      <div class="grid-2">
        <button class="btn btn-dark" id="btn-random">🎲 สุ่มจัดทีมอัตโนมัติ</button>
        <button class="btn btn-dark" id="btn-lock">🔒 ล็อกคู่สมาชิก (Team A)</button>
      </div>

      <div class="grid-4">
        <div class="form-group">
          <label>Team A คนที่ 1</label>
          <input type="text" id="p-a1" class="form-control" placeholder="เลือกหรือพิมพ์ชื่อสมาชิก" list="member-list">
        </div>
        <div class="form-group">
          <label>Team A คนที่ 2</label>
          <input type="text" id="p-a2" class="form-control" placeholder="เลือกหรือพิมพ์ชื่อสมาชิก" list="member-list">
        </div>
        <div class="form-group">
          <label>Team B คนที่ 1</label>
          <input type="text" id="p-b1" class="form-control" placeholder="เลือกหรือพิมพ์ชื่อสมาชิก" list="member-list">
        </div>
        <div class="form-group">
          <label>Team B คนที่ 2</label>
          <input type="text" id="p-b2" class="form-control" placeholder="เลือกหรือพิมพ์ชื่อสมาชิก" list="member-list">
        </div>
      </div>

      <datalist id="member-list"></datalist>

      <div class="grid-2">
        <button class="btn btn-dark" id="btn-waiting-modal">⏳ รอจับคู่ (0 คน)</button>
        <button class="btn btn-navy" id="btn-add-queue">เพิ่มคิวการแข่งขัน</button>
      </div>
    </div>

    <!-- Match Queue Section -->
    <div class="section-header">
      <span>📋 รายการคิวแข่งขัน</span>
    </div>
    <div id="queue-list-container">
      <p style="color: #64748b; text-align: center; padding: 1rem;">ยังไม่มีคิวการแข่งขันในขณะนี้</p>
    </div>

    <hr class="divider">
  </main>

  <!-- Modal Manage Waiting Pool -->
  <div class="modal" id="modal-pool">
    <div class="modal-content">
      <div class="section-header">
        <span>👥 จัดการผู้เล่นที่รอจับคู่</span>
        <button class="btn btn-sm btn-dark" style="width:auto" onclick="toggleModal(false)">✕</button>
      </div>
      <div class="form-group">
        <input type="text" id="new-member-input" class="form-control" placeholder="พิมพ์ชื่อผู้เล่นแล้วกด Enter">
      </div>
      <div class="tag-container" id="waiting-tags"></div>
      <button class="btn btn-navy" onclick="toggleModal(false)" style="margin-top: 1rem;">ตกลง</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-left">
      <p><strong>© 2026 TOBNGUEAKSAN V.1 All rights reserved.</strong></p>
      <p>Designed & Developed by <strong>Victor</strong></p>
    </div>
    <div class="footer-right">
      <div class="ig-icon">📷</div>
      <span>howtoobeanutto._</span>
    </div>
  </footer>

  <script>
    // State Data
    let waitingPool = ["ตูน", "บิ๊ก", "ปอนด์", "เจมส์", "เบส", "นัท", "เอ็กซ์", "อาร์ม"];
    let queues = [];
    let isLockedTeamA = false;

    // Elements
    const inputs = {
      a1: document.getElementById('p-a1'),
      a2: document.getElementById('p-a2'),
      b1: document.getElementById('p-b1'),
      b2: document.getElementById('p-b2')
    };
    const btnRandom = document.getElementById('btn-random');
    const btnLock = document.getElementById('btn-lock');
    const btnAddQueue = document.getElementById('btn-add-queue');
    const btnWaitingModal = document.getElementById('btn-waiting-modal');
    const modalPool = document.getElementById('modal-pool');
    const waitingTags = document.getElementById('waiting-tags');
    const newMemberInput = document.getElementById('new-member-input');
    const memberDatalist = document.getElementById('member-list');
    const queueContainer = document.getElementById('queue-list-container');

    // Initialize UI
    function init() {
      updateWaitingUI();
      
      btnRandom.addEventListener('click', randomizeMatch);
      btnLock.addEventListener('click', toggleLockTeamA);
      btnAddQueue.addEventListener('click', addQueue);
      btnWaitingModal.addEventListener('click', () => toggleModal(true));
      
      newMemberInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && e.target.value.trim() !== '') {
          addMemberToPool(e.target.value.trim());
          e.target.value = '';
        }
      });
    }

    // Modal Operations
    function toggleModal(show) {
      modalPool.style.display = show ? 'flex' : 'none';
    }

    // Waiting Pool Management
    function updateWaitingUI() {
      btnWaitingModal.innerText = `⏳ รอจับคู่ (${waitingPool.length} คน)`;
      
      // Update Modal Tags
      waitingTags.innerHTML = waitingPool.map((name, index) => `
        <span class="tag">
          ${name}
          <span class="close" onclick="removeMemberFromPool(${index})">✕</span>
        </span>
      `).join('');

      // Update Autocomplete Datalist
      memberDatalist.innerHTML = waitingPool.map(name => `<option value="${name}">`).join('');
    }

    function addMemberToPool(name) {
      if (!waitingPool.includes(name)) {
        waitingPool.push(name);
        updateWaitingUI();
      }
    }

    function removeMemberFromPool(index) {
      waitingPool.splice(index, 1);
      updateWaitingUI();
    }

    // Matchmaking Logic
    function randomizeMatch() {
      // Determine required slots
      const slots = isLockedTeamA ? ['b1', 'b2'] : ['a1', 'a2', 'b1', 'b2'];
      
      // Check available pool (exclude manually selected players)
      const currentSelected = Object.values(inputs)
        .map(i => i.value.trim())
        .filter(v => v !== '');

      const availablePool = waitingPool.filter(p => !currentSelected.includes(p));

      if (availablePool.length < slots.length) {
        alert(`ต้องมีสมาชิกผู้เล่นสุ่มอีกอย่างน้อย ${slots.length} คน ในรายชื่อรอจับคู่`);
        return;
      }

      // Shuffle available pool
      const shuffled = [...availablePool].sort(() => 0.5 - Math.random());

      slots.forEach((slot, idx) => {
        inputs[slot].value = shuffled[idx];
      });
    }

    // Lock Pair Logic
    function toggleLockTeamA() {
      isLockedTeamA = !isLockedTeamA;
      if (isLockedTeamA) {
        if (!inputs.a1.value || !inputs.a2.value) {
          alert('กรุณากรอกชื่อ Team A ให้ครบ 2 คนก่อนทำการล็อกคู่');
          isLockedTeamA = false;
          return;
        }
        btnLock.classList.add('btn-active-lock');
        btnLock.innerText = '🔓 ปลดล็อกคู่สมาชิก';
        inputs.a1.disabled = true;
        inputs.a2.disabled = true;
      } else {
        btnLock.classList.remove('btn-active-lock');
        btnLock.innerText = '🔒 ล็อกคู่สมาชิก (Team A)';
        inputs.a1.disabled = false;
        inputs.a2.disabled = false;
      }
    }

    // Add Match Queue
    function addQueue() {
      const pA1 = inputs.a1.value.trim();
      const pA2 = inputs.a2.value.trim();
      const pB1 = inputs.b1.value.trim();
      const pB2 = inputs.b2.value.trim();

      if (!pA1 || !pA2 || !pB1 || !pB2) {
        alert('กรุณากรอกผู้เล่นให้ครบทั้ง 4 คน');
        return;
      }

      const matchPlayers = [pA1, pA2, pB1, pB2];
      const hasDuplicates = new Set(matchPlayers).size !== matchPlayers.length;
      if (hasDuplicates) {
        alert('ชื่อผู้เล่นในแมตช์ต้องไม่ซ้ำกัน');
        return;
      }

      // Add to Queue list
      const matchData = { id: Date.now(), teamA: [pA1, pA2], teamB: [pB1, pB2] };
      queues.push(matchData);

      // Remove players from waiting pool while playing
      waitingPool = waitingPool.filter(player => !matchPlayers.includes(player));
      updateWaitingUI();

      // Reset Form & Lock
      if (isLockedTeamA) toggleLockTeamA();
      inputs.a1.value = '';
      inputs.a2.value = '';
      inputs.b1.value = '';
      inputs.b2.value = '';

      renderQueueList();
    }

    // Render Queue UI
    function renderQueueList() {
      if (queues.length === 0) {
        queueContainer.innerHTML = `<p style="color: #64748b; text-align: center; padding: 1rem;">ยังไม่มีคิวการแข่งขันในขณะนี้</p>`;
        return;
      }

      queueContainer.innerHTML = queues.map((q, idx) => `
        <div class="queue-item">
          <div>
            <strong>คิวที่ ${idx + 1}</strong>
            <div class="match-teams" style="margin-top: 0.3rem;">
              <span>${q.teamA[0]} & ${q.teamA[1]}</span>
              <span class="vs-badge">VS</span>
              <span>${q.teamB[0]} & ${q.teamB[1]}</span>
            </div>
          </div>
          <button class="btn btn-sm btn-success" style="width: auto;" onclick="completeMatch(${q.id})">
            ✓ จบการแข่งขัน (คืนเข้าแถว)
          </button>
        </div>
      `).join('');
    }

    // Finish match and return players to pool
    function completeMatch(id) {
      const matchIndex = queues.findIndex(q => q.id === id);
      if (matchIndex !== -1) {
        const match = queues[matchIndex];
        // Re-add players to waiting pool
        const matchPlayers = [...match.teamA, ...match.teamB];
        matchPlayers.forEach(player => addMemberToPool(player));
        
        queues.splice(matchIndex, 1);
        renderQueueList();
      }
    }

    // Start App
    init();
  </script>
</body>
</html>
