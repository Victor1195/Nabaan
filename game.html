<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match - nabaan</title>
  <!-- ดึงฟอนต์ Kanit จาก Google Fonts ให้ตรงตามดีไซน์ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }

    body {
      background-color: #f4f5f7;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    .navbar {
      background-color: #0d0d0d;
      color: #ffffff;
      padding: 0.75rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 2.5rem;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-link {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      opacity: 0.9;
    }

    .nav-link:hover, .nav-link.active {
      opacity: 1;
    }

    .logout-btn {
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Main Container */
    .container {
      max-width: 1100px;
      width: 100%;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      flex: 1;
    }

    .page-title {
      font-size: 2.25rem;
      font-weight: 800;
      margin-bottom: 2rem;
      color: #0f172a;
    }

    /* Card Content */
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin: 1.5rem 0;
    }

    /* Action Buttons */
    .btn {
      width: 100%;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .btn-dark {
      background-color: #23272e;
      color: #ffffff;
    }

    .btn-dark:hover {
      background-color: #1a1d23;
    }

    .btn-navy {
      background-color: #111625;
      color: #ffffff;
    }

    .btn-navy:hover {
      background-color: #0a0d17;
    }

    /* Form Controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1a1a1a;
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      color: #334155;
      background-color: #ffffff;
    }

    .form-control::placeholder {
      color: #94a3b8;
    }

    .form-control:focus {
      border-color: #94a3b8;
    }

    /* Divider */
    .divider {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin-top: 4rem;
    }

    /* Footer */
    .footer {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      color: #475569;
      font-size: 0.85rem;
    }

    .footer-left p {
      margin-bottom: 0.25rem;
    }

    .footer-left strong {
      color: #0284c7;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      color: #334155;
    }

    .ig-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      .grid-4 {
        grid-template-columns: 1fr 1fr;
      }
    }
    @media (max-width: 600px) {
      .grid-2, .grid-4 {
        grid-template-columns: 1fr;
      }
      .navbar {
        flex-direction: column;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header / Nav -->
  <nav class="navbar">
    <div class="nav-left">
      <div class="brand">
        <span>🏸</span> Ngueak San
      </div>
      <div class="nav-links">
        <a href="#" class="nav-link">🏠 Home</a>
        <a href="#" class="nav-link active">⚔️ Match</a>
        <a href="#" class="nav-link">👤 Member</a>
        <a href="#" class="nav-link">💰 Payment</a>
      </div>
    </div>
    <div class="nav-right">
      <a href="#" class="logout-btn"><span style="color:#d97706;">❚</span> Logout</a>
    </div>
  </nav>

  <!-- Content -->
  <main class="container">
    <h1 class="page-title">MATCH : ตารางแข่งขัน</h1>

    <div class="card">
      <!-- Top Action Buttons -->
      <div class="grid-2">
        <button class="btn btn-dark">🎲 สุ่มจัดทีมอัตโนมัติ</button>
        <button class="btn btn-dark">🔒 ล็อกคู่สมาชิก</button>
      </div>

      <!-- Player Inputs -->
      <div class="grid-4">
        <div class="form-group">
          <label>Team A คนที่ 1</label>
          <input type="text" class="form-control" placeholder="เลือกหรือพิมพ์ชื่อสมาชิก">
        </div>
        <div class="form-group">
          <label>Team A คนที่ 2</label>
          <input type="text" class="form-control" placeholder="เลือกหรือพิมพ์ชื่อสมาชิก">
        </div>
        <div class="form-group">
          <label>Team B คนที่ 1</label>
          <input type="text" class="form-control" placeholder="เลือกหรือพิมพ์ชื่อสมาชิก">
        </div>
        <div class="form-group">
          <label>Team B คนที่ 2</label>
          <input type="text" class="form-control" placeholder="เลือกหรือพิมพ์ชื่อสมาชิก">
        </div>
      </div>

      <!-- Bottom Action Buttons -->
      <div class="grid-2">
        <button class="btn btn-dark">⏳ รอจับคู่ (0 คน)</button>
        <button class="btn btn-navy">เพิ่มคิวการแข่งขัน</button>
      </div>
    </div>

    <hr class="divider">
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-left">
      <p><strong>© 2026 TOBNGUEAKSAN V.1 All rights reserved.</strong></p>
      <p>Designed & Developed by <strong>Victor</strong></p>
    </div>
    <div class="footer-right">
      <div class="ig-icon">📷</div>
      <span>howtoobeanutto._</span>
    </div>
  </footer>

</body>
</html>
