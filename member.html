<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- สำรองการเปลี่ยนหน้าอัตโนมัติหาก JavaScript ไม่ทำงาน -->
    <meta http-equiv="refresh" content="1;url=https://script.google.com/macros/s/AKfycbzdpPnfx9FYr1_fi1aeIDtQDfBLNtdoa130iERlIYt5KokAYz0zbHnsbyMiRisXloBCDw/exec">
    
    <title>กำลังนำท่านไปยังระบบสมาชิก...</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #0f172a;
        }

        .redirect-card {
            background: #ffffff;
            padding: 36px 28px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #e2e8f0;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .redirect-card h2 {
            margin: 0 0 8px 0;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .redirect-card p {
            color: #64748b;
            font-size: 0.875rem;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
            color: #0f172a;
        }
    </style>

    <script>
        // เปลี่ยนหน้าทันทีด้วย JavaScript
        window.location.href = "https://script.google.com/macros/s/AKfycbzA3nzIjcTWIcQfPyUdLVIux3jTlrWCsjZWN0ib3nPhF-sWYbZUGNrpBaBuD2NWKVx7Bw/exec";
    </script>
</head>
<body>

    <div class="redirect-card">
        <div class="spinner"></div>
        <h2>กำลังนำคุณไปยังระบบสมาชิก...</h2>
        <p>หากระบบไม่เปลี่ยนหน้าให้อัตโนมัติภายใน 2 วินาที สามารถเลือกกดปุ่มด้านล่างได้ทันที</p>

        <div class="btn-group">
            <a href="https://script.google.com/macros/s/AKfycbzA3nzIjcTWIcQfPyUdLVIux3jTlrWCsjZWN0ib3nPhF-sWYbZUGNrpBaBuD2NWKVx7Bw/exec" class="btn btn-primary">
                เข้าสู่ระบบสมาชิก ➔
            </a>
            <a href="index.html" class="btn btn-secondary">
                ← กลับหน้าแรก (index.html)
            </a>
        </div>
    </div>

</body>
</html>
